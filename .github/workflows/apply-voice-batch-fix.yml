name: apply-voice-batch-fix

# One-shot patch workflow; remove after it commits the gateway fix.
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-voice-batch-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch voice gateway
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/heritage_explorer/voice_gateway.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "        batch_languages: dict[int, str] = {}\n        batch_partials: dict[int, str] = {}\n",
              "        batch_languages: dict[int, str] = {}\n        batch_failures: set[int] = set()\n        batch_partials: dict[int, str] = {}\n",
          )
          replace_once(
              "            batch_languages.clear()\n            batch_partials.clear()\n",
              "            batch_languages.clear()\n            batch_failures.clear()\n            batch_partials.clear()\n",
          )
          replace_once(
              "                ordered_ids = sorted(results)\n                asr_candidates = tuple(\n",
              "                ordered_ids = sorted(results)\n                failures = {item_id for item_id in ordered_ids if item_id in batch_failures}\n                batch_failures.difference_update(ordered_ids)\n                asr_candidates = tuple(\n",
          )
          replace_once(
              "                if not raw_text:\n                    batch_partials.clear()\n                    partial_revision = 0\n                    await send({\"type\": \"utterance.rejected\", \"utterance_id\": committed_id})\n                    return\n",
              "                if not raw_text:\n                    batch_partials.clear()\n                    partial_revision = 0\n                    if failures:\n                        await send(\n                            {\n                                \"type\": \"error\",\n                                \"utterance_id\": committed_id,\n                                \"code\": \"asr_unavailable\",\n                                \"message\": \"语音识别暂时不可用\",\n                            }\n                        )\n                    else:\n                        await send(\n                            {\"type\": \"utterance.rejected\", \"utterance_id\": committed_id}\n                        )\n                    return\n",
          )
          replace_once(
              "                if generation == batch_generation:\n                    batch_results[utterance_id] = \"\"\n                    batch_candidates[utterance_id] = ()\n                    batch_languages[utterance_id] = \"\"\n                await send({\"type\": \"error\", \"message\": \"语音识别暂时不可用\"})\n",
              "                if generation == batch_generation:\n                    batch_results[utterance_id] = \"\"\n                    batch_candidates[utterance_id] = ()\n                    batch_languages[utterance_id] = \"\"\n                    batch_failures.add(utterance_id)\n",
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "Rino"
          git config user.email "71957726+RinoPaw@users.noreply.github.com"
          git add src/heritage_explorer/voice_gateway.py
          git diff --cached --check
          git commit -m "Defer ASR errors until voice batch commit"
          git push
