name: refresh-python-deps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-python-deps.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - name: Refresh vulnerable Python dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          text = text.replace('"pytest>=8,<9"', '"pytest>=9,<10"')
          pyproject.write_text(text)

          verify = Path(".github/workflows/verify.yml")
          text = verify.read_text()
          text = text.replace(
              "      - name: Audit Python dependencies\n        continue-on-error: true\n        run: uv run --with pip-audit==2.10.1 pip-audit --skip-editable\n",
              "      - name: Audit Python dependencies\n        run: uv run --with pip-audit==2.10.1 pip-audit --skip-editable\n",
          )
          verify.write_text(text)
          PY
          uv lock --upgrade-package anyio --upgrade-package pytest
      - name: Verify refreshed environment
        run: |
          uv sync --frozen --group dev
          uv run pytest -q
          uv run ruff check server/src tools server/tests
          uv run --with pip-audit==2.10.1 pip-audit --skip-editable
      - name: Commit refreshed dependencies
        run: |
          rm .github/workflows/refresh-python-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock .github/workflows/verify.yml .github/workflows/refresh-python-deps.yml
          git commit -m "deps: upgrade vulnerable Python dependencies"
          git push
