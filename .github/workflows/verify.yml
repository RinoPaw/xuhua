name: verify

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HOST: 127.0.0.1
      PORT: "5050"
      DEBUG: "0"
      DATASET_PATH: data/processed/heritage_items.json
      FRONTEND_DIR: web/dist/client
      AI_API_KEY: ""
      AI_BASE_URL: https://api.deepseek.com
      AI_MODEL: deepseek-flash
      AI_TIMEOUT: "60"
      AI_FIRST_TOKEN_TIMEOUT: "8"
      AI_FIRST_TOKEN_MAX_ATTEMPTS: "2"
      AI_MAX_CONTEXT_CHARS: "5200"
      XF_APP_ID: ""
      XF_API_KEY: ""
      XF_API_SECRET: ""
      XF_ASR_HOST: iat.xf-yun.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
      - run: uv run ruff check server/src tools server/tests
      - run: uv run python -m compileall -q server/src tools
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Build production Docker image
        run: docker build -t xuhua:verify .
      - name: Smoke production Docker image
        run: |
          docker run --rm --detach --name xuhua-verify \
            --memory=512m \
            --cpus=0.5 \
            --pids-limit=256 \
            -p 127.0.0.1:5051:5050 \
            -e HOST=0.0.0.0 \
            -e PORT=5050 \
            -e DEBUG=0 \
            -e DATASET_PATH=data/processed/heritage_items.json \
            -e FRONTEND_DIR=web/dist/client \
            -e AI_API_KEY= \
            -e AI_BASE_URL=https://api.deepseek.com \
            -e AI_MODEL=deepseek-flash \
            -e AI_TIMEOUT=60 \
            -e AI_FIRST_TOKEN_TIMEOUT=8 \
            -e AI_FIRST_TOKEN_MAX_ATTEMPTS=2 \
            -e AI_MAX_CONTEXT_CHARS=5200 \
            -e XF_APP_ID= \
            -e XF_API_KEY= \
            -e XF_API_SECRET= \
            -e XF_ASR_HOST=iat.xf-yun.com \
            -e WEB_CONCURRENCY=4 \
            xuhua:verify
          trap 'docker rm -f xuhua-verify >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:5051"
          last_error = None
          for _ in range(120):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=2) as response:
                      body = json.load(response)
                  if body.get("status") == "ok":
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise RuntimeError(f"production container did not become healthy: {last_error}")

          with urllib.request.urlopen(base + "/api/meta", timeout=3) as response:
              meta = json.load(response)
          assert meta["item_count"] >= 3000
          assert meta["category_count"] >= 10

          with urllib.request.urlopen(base + "/", timeout=3) as response:
              html = response.read().decode("utf-8")
          assert 'id="root"' in html
          PY
