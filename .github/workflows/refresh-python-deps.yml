name: refresh-python-deps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-python-deps.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
      - name: Allow current pytest major
        run: python -c 'from pathlib import Path; p=Path("pyproject.toml"); s=p.read_text(); s=s.replace("pytest>=8,<9", "pytest>=9,<10"); p.write_text(s)'
      - name: Refresh vulnerable Python dependencies
        run: uv lock --upgrade-package anyio --upgrade-package pytest
      - name: Verify refreshed environment
        run: |
          uv sync --frozen --group dev
          uv run pytest -q
          uv run ruff check server/src tools server/tests
          uv run --with pip-audit==2.10.1 pip-audit --skip-editable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refreshed-python-deps
          path: |
            pyproject.toml
            uv.lock
          if-no-files-found: error
