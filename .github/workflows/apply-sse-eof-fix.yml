name: apply-sse-eof-fix

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-sse-eof-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch incomplete SSE handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/App.jsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one match, got {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { cancelTurnBestEffort, nextActiveTurnId } from "./lib/chatLifecycle.js";\n',
              'import {\n  cancelTurnBestEffort,\n  isTerminalTurnEvent,\n  nextActiveTurnId,\n} from "./lib/chatLifecycle.js";\n',
          )
          replace_once(
              '    let firstTextLogged = false;\n',
              '    let firstTextLogged = false;\n    let terminalReceived = false;\n',
          )
          replace_once(
              '          const type = event.type || eventName;\n          dispatch({ type: "event", event: { ...event, type } });\n',
              '          const type = event.type || eventName;\n          if (isTerminalTurnEvent(type)) terminalReceived = true;\n          dispatch({ type: "event", event: { ...event, type } });\n',
          )
          replace_once(
              '        if (done) {\n          if (buffer.trim()) consume(buffer);\n          break;\n        }\n      }\n    } catch (error) {\n      if (error?.name !== "AbortError" && isCurrent()) {\n        dispatch({ type: "error", message: "回答服务暂时不可用" });\n      }\n',
              '        if (done) {\n          if (buffer.trim()) consume(buffer);\n          break;\n        }\n      }\n      if (isCurrent() && !terminalReceived) throw new Error("stream_ended_before_terminal");\n    } catch (error) {\n      if (error?.name !== "AbortError" && isCurrent()) {\n        realtimeRef.current?.stopSpeaking?.();\n        dispatch({ type: "error", message: "回答服务暂时不可用" });\n      }\n',
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "Rino"
          git config user.email "71957726+RinoPaw@users.noreply.github.com"
          git add frontend/src/App.jsx
          git rm .github/workflows/apply-sse-eof-fix.yml
          git diff --cached --check
          git commit -m "Handle chat streams ending before a terminal event"
          git push
