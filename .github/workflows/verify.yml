name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: 127.0.0.1
      PORT: "5050"
      DEBUG: "0"
      DATASET_PATH: data/processed/heritage_items.json
      AI_API_KEY: ""
      AI_BASE_URL: https://api.deepseek.com
      AI_MODEL: deepseek-flash
      AI_TIMEOUT: "60"
      AI_FIRST_TOKEN_TIMEOUT: "8"
      AI_FIRST_TOKEN_MAX_ATTEMPTS: "2"
      AI_RESPONSE_TIMEOUT: "75"
      AI_MAX_OUTPUT_CHARS: "6000"
      AI_MAX_CONTEXT_CHARS: "5200"
      XF_APP_ID: ""
      XF_API_KEY: ""
      XF_API_SECRET: ""
      XF_ASR_HOST: iat.xf-yun.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: web/public/wake
          key: wake-assets-${{ runner.os }}-${{ hashFiles('web/scripts/prepare-wake-assets.mjs') }}
      - run: uv lock --check
      - run: uv sync --frozen --group dev
      - run: uv run --with pip-audit==2.10.1 pip-audit --skip-editable
      - run: uv run pytest -q
      - run: uv run ruff check server/src tools server/tests
      - run: uv run python -m compileall -q server/src tools
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run prepare:assets
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Smoke application runtime
        run: |
          uv run xuhua > /tmp/xuhua.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:5050"
          last_error = None
          for _ in range(120):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=2) as response:
                      body = json.load(response)
                  if body.get("status") == "ok":
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise RuntimeError(f"application did not become healthy: {last_error}")

          with urllib.request.urlopen(base + "/api/meta", timeout=3) as response:
              meta = json.load(response)
          assert meta["item_count"] >= 3000
          assert meta["category_count"] >= 10

          with urllib.request.urlopen(base + "/api/items?limit=1&offset=0", timeout=3) as response:
              items = json.load(response)
          assert items["total"] >= 3000
          assert len(items["items"]) == 1

          with urllib.request.urlopen(base + "/", timeout=3) as response:
              html = response.read().decode("utf-8")
          assert 'id="root"' in html
          PY
