name: verify

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HOST: 127.0.0.1
      PORT: "5050"
      DEBUG: "0"
      DATASET_PATH: data/processed/heritage_items.json
      FRONTEND_DIR: frontend/dist/client
      AI_API_KEY: ""
      AI_BASE_URL: https://api.deepseek.com
      AI_MODEL: deepseek-v4-flash
      AI_TIMEOUT: "60"
      AI_FIRST_TOKEN_TIMEOUT: "8"
      AI_FIRST_TOKEN_MAX_ATTEMPTS: "2"
      AI_MAX_CONTEXT_CHARS: "5200"
      XF_APP_ID: ""
      XF_API_KEY: ""
      XF_API_SECRET: ""
      XF_ASR_HOST: iat.xf-yun.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv run ruff check src scripts tests app.py
      - run: uv run python -m compileall -q src scripts app.py
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Smoke test application startup
        run: |
          uv run python app.py > /tmp/xuhua.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:5050"
          last_error = None
          for _ in range(40):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=2) as response:
                      body = json.load(response)
                  if body.get("status") == "ok":
                      break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise RuntimeError(f"application did not become healthy: {last_error}")

          with urllib.request.urlopen(base + "/api/meta", timeout=3) as response:
              meta = json.load(response)
          assert meta["item_count"] >= 3000
          assert meta["category_count"] >= 10

          with urllib.request.urlopen(base + "/", timeout=3) as response:
              html = response.read().decode("utf-8")
          assert 'id="root"' in html
          PY
