name: xuhua

services:
  app:
    image: "xuhua:${XUHUA_COMMIT:-latest}"
    build:
      context: .
    container_name: xuhua
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    env_file:
      - "${XUHUA_ENV_FILE:-/etc/xuhua/xuhua.env}"
    environment:
      HOST: 0.0.0.0
      PORT: 5050
    ports:
      - "127.0.0.1:${XUHUA_APP_PORT:-5050}:5050"
    labels:
      io.xuhua.commit: "${XUHUA_COMMIT:-unknown}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5050/healthz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
